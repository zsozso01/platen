name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, not the solution. What does your PC (or another app) let you do that Platen does not?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
