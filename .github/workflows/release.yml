name: Release

# Push a tag like v0.1.0 to build a signed release APK and publish it as a GitHub Release.
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the release keystore (base64 -w0 release.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password (omit if same as keystore password)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check tag matches versionName
        run: |
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $name in app/build.gradle.kts" >&2
            exit 1
          fi
      - name: Build release APK
        run: ./gradlew :app:assembleRelease -Pplaten.warningsAsErrors=true --stacktrace
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret; cannot sign the release APK." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          unsigned=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass "env:${KEY_PASSWORD:+KEY_PASSWORD}${KEY_PASSWORD:-KEYSTORE_PASSWORD}" \
            --out "platen-${GITHUB_REF_NAME}.apk" "$unsigned"
          "$apksigner" verify --print-certs "platen-${GITHUB_REF_NAME}.apk"
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum "platen-${GITHUB_REF_NAME}.apk" > "platen-${GITHUB_REF_NAME}.apk.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "platen-${GITHUB_REF_NAME}.apk" "platen-${GITHUB_REF_NAME}.apk.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes
